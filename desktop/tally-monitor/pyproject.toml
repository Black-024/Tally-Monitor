[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-monitor"
version = "1.0.0"
description = "Tally Monitor: gestión, análisis y exportación de encuestas de Tally (solo lectura)"
requires-python = ">=3.12"
dependencies = []          # el núcleo usa solo la biblioteca estándar
[project.optional-dependencies]
ui = ["PySide6>=6.8,<7"]
export = ["openpyxl>=3.1", "reportlab>=4.0"]
dev = ["pytest", "pytest-qt"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
tally_monitor = ["storage/migrations_sql/*/*.sql", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
